<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f5f7fa">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flicksy">

<title>Flicksy</title>

<style>
body {
    font-family: sans-serif;
    background: #f5f7fa;
    padding: 12px;
}

main {
    max-width: 520px;
    margin: auto;
}

img {
    display: block;
    max-width: 320px;
    width: 100%;
    margin: auto;
}

input {
    width: 100%;
    height: 48px;
    margin-top: 12px;
    font-size: 18px;
    box-sizing: border-box;
}

.row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

button {
    flex: 1;
    height: 46px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    touch-action: manipulation;
}

button[data-hotkey="alt-tab"] {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}

.connection {
    text-align: center;
    margin-top: 4px;
}

.screenshot-preview-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: stretch;
}

.screenshot-preview {
    flex: 1;
    min-width: 0;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
    background: #111827;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

#screenshotPreviewImage {
    display: block;
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    object-fit: contain;
}

#screenshotPreviewStatus {
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: #d1d5db;
}

#screenshotButton {
    flex: 0 0 120px;
    height: 110px;
}

.screenshot-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    flex-direction: column;
    background: #111827;
    color: #ffffff;
    box-sizing: border-box;
    padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
}

.screenshot-overlay.show {
    display: flex;
}

.screenshot-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.screenshot-toolbar button {
    height: 42px;
    background: #374151;
    color: #ffffff;
}

#screenshotRefreshButton {
    background: #2563eb;
}

.screenshot-view {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
    background: #000000;
}

#screenshotImage {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

#screenshotStatus {
    padding: 20px;
    text-align: center;
    color: #d1d5db;
}

.screenshot-controls {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.screenshot-controls button {
    background: #e5e7eb;
    color: #111827;
}

#screenshotAltTabButton {
    background: #7c3aed;
    color: #ffffff;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}
</style>
</head>

<body>

<main>

<img id="banner" alt="Flicksy">

<div class="connection">
    Connected / <span id="host"></span>
</div>

<div class="screenshot-preview-row">

    <div id="screenshotPreview" class="screenshot-preview">
        <div id="screenshotPreviewStatus">Loading screenshot...</div>
        <img id="screenshotPreviewImage" alt="Screenshot preview" hidden>
    </div>

    <button id="screenshotButton" tabindex="-1">SCREENSHOT</button>

</div>

<input
    id="text"
    type="text"
    enterkeyhint="send"
    autocomplete="off">

<div class="row">
    <button data-hotkey="alt-tab" tabindex="-1">ALT+TAB</button>
    <button data-vk="13" tabindex="-1">ENTER</button>
</div>

<div class="row">
    <button data-vk="27" tabindex="-1">ESC</button>
    <button data-vk="9"  tabindex="-1">TAB</button>
    <button data-vk="8"  tabindex="-1">BS</button>
</div>

<div class="row">
    <button data-vk="38" tabindex="-1">↑</button>
    <button data-vk="40" tabindex="-1">↓</button>
    <button data-vk="37" tabindex="-1">←</button>
    <button data-vk="39" tabindex="-1">→</button>
</div>

<div id="screenshotOverlay" class="screenshot-overlay">

    <div class="screenshot-toolbar">
        <button id="screenshotCloseButton" type="button">CLOSE</button>
        <button id="screenshotRefreshButton" type="button">REFRESH</button>
    </div>

    <div class="screenshot-view">
        <div id="screenshotStatus">Loading screenshot...</div>
        <img id="screenshotImage" alt="Screenshot" hidden>
    </div>

    <div class="screenshot-controls">
        <button id="screenshotAltTabButton" type="button">ALT+TAB</button>
        <button data-screen-vk="13" type="button">ENTER</button>
        <button data-screen-vk="27" type="button">ESC</button>
    </div>

    <div class="screenshot-controls">
        <button data-screen-vk="37" type="button">←</button>
        <button data-screen-vk="38" type="button">↑</button>
        <button data-screen-vk="40" type="button">↓</button>
        <button data-screen-vk="39" type="button">→</button>
    </div>

</div>

</main>

<script>
const input = document.getElementById("text");

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("banner").src =
    "/banner.png?token=" + encodeURIComponent(token);

document.getElementById("host").textContent = location.host;

function post(url, body)
{
    return fetch(
        url + "?token=" + encodeURIComponent(token),
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: body
        });
}

function sendText()
{
    if (!input.value)
        return;

    const text = input.value;

    input.focus();

    post(
        "/input",
        "text=" + encodeURIComponent(text));

    input.value = "";
}

function sendKey(vk)
{
    input.focus();

    post(
        "/key",
        "vk=" + encodeURIComponent(vk));
}

let hotKeyRequest = Promise.resolve();

function sendHotKey(combo)
{
    hotKeyRequest = hotKeyRequest
        .catch(() => {})
        .then(() =>
            post(
                "/hotkey",
                "combo=" + encodeURIComponent(combo)));

    return hotKeyRequest;
}

input.addEventListener("keydown", e =>
{
    if (e.isComposing)
        return;

    if (e.key === "Enter")
    {
        e.preventDefault();
        sendText();
    }
});

document.querySelectorAll("[data-vk]").forEach(button =>
{
    button.onpointerdown = () => input.focus();

    button.onclick = () =>
        sendKey(Number(button.dataset.vk));
});

const altTabButton =
    document.querySelector('[data-hotkey="alt-tab"]');

if (altTabButton)
{
    altTabButton.onpointerdown = e =>
    {
        e.preventDefault();

        if (altTabButton.setPointerCapture)
            altTabButton.setPointerCapture(e.pointerId);

        sendHotKey("alt-tab");
    };

    const endAltTab = e =>
    {
        if (altTabButton.hasPointerCapture &&
            altTabButton.hasPointerCapture(e.pointerId))
        {
            altTabButton.releasePointerCapture(e.pointerId);
        }

        sendHotKey("alt-up");
    };

    altTabButton.onpointerup = endAltTab;
    altTabButton.onpointercancel = endAltTab;
    altTabButton.oncontextmenu = e => e.preventDefault();
}

const screenshotButton =
    document.getElementById("screenshotButton");

const screenshotPreview =
    document.getElementById("screenshotPreview");

const screenshotPreviewImage =
    document.getElementById("screenshotPreviewImage");

const screenshotPreviewStatus =
    document.getElementById("screenshotPreviewStatus");

const screenshotOverlay =
    document.getElementById("screenshotOverlay");

const screenshotImage =
    document.getElementById("screenshotImage");

const screenshotStatus =
    document.getElementById("screenshotStatus");

const screenshotCloseButton =
    document.getElementById("screenshotCloseButton");

const screenshotRefreshButton =
    document.getElementById("screenshotRefreshButton");

const screenshotAltTabButton =
    document.getElementById("screenshotAltTabButton");

function makeScreenshotUrl()
{
    return "/screenshot?token=" +
        encodeURIComponent(token) +
        "&t=" +
        Date.now();
}

function refreshScreenshotPreview()
{
    screenshotPreviewImage.hidden = true;
    screenshotPreviewStatus.hidden = false;
    screenshotPreviewStatus.textContent = "Loading screenshot...";

    const image = new Image();

    image.onload = () =>
    {
        screenshotPreviewImage.src = image.src;
        screenshotPreviewImage.hidden = false;
        screenshotPreviewStatus.hidden = true;
    };

    image.onerror = () =>
    {
        screenshotPreviewImage.hidden = true;
        screenshotPreviewStatus.hidden = false;
        screenshotPreviewStatus.textContent = "Failed to load screenshot.";
    };

    image.src = makeScreenshotUrl();
}

function refreshScreenshot()
{
    screenshotImage.hidden = true;
    screenshotStatus.hidden = false;
    screenshotStatus.textContent = "Loading screenshot...";

    const image = new Image();

    image.onload = () =>
    {
        screenshotImage.src = image.src;
        screenshotImage.hidden = false;
        screenshotStatus.hidden = true;

        screenshotPreviewImage.src = image.src;
        screenshotPreviewImage.hidden = false;
        screenshotPreviewStatus.hidden = true;
    };

    image.onerror = () =>
    {
        screenshotImage.hidden = true;
        screenshotStatus.hidden = false;
        screenshotStatus.textContent = "Failed to load screenshot.";
    };

    image.src = makeScreenshotUrl();
}

function showScreenshotOverlay()
{
    screenshotOverlay.classList.add("show");
    refreshScreenshot();
}

function hideScreenshotOverlay()
{
    screenshotOverlay.classList.remove("show");
}

screenshotButton.onclick = () =>
{
    refreshScreenshotPreview();
};

screenshotPreview.onclick = () =>
{
    showScreenshotOverlay();
};

screenshotRefreshButton.onclick = () =>
{
    refreshScreenshot();
};

screenshotCloseButton.onclick = () =>
{
    hideScreenshotOverlay();
};

document.querySelectorAll("[data-screen-vk]").forEach(button =>
{
    button.onclick = () =>
        sendKey(Number(button.dataset.screenVk));
});

function bindAltTabButton(button)
{
    if (!button)
        return;

    button.onpointerdown = e =>
    {
        e.preventDefault();

        if (button.setPointerCapture)
            button.setPointerCapture(e.pointerId);

        sendHotKey("alt-tab");
    };

    const endAltTab = e =>
    {
        if (button.hasPointerCapture &&
            button.hasPointerCapture(e.pointerId))
        {
            button.releasePointerCapture(e.pointerId);
        }

        sendHotKey("alt-up");
    };

    button.onpointerup = endAltTab;
    button.onpointercancel = endAltTab;
    button.oncontextmenu = e => e.preventDefault();
}

bindAltTabButton(screenshotAltTabButton);

refreshScreenshotPreview();

</script>

</body>
</html>
