<!DOCTYPE html>
<html lang="ja">
<head>
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f5f7fa">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flicksy">

<title>Flicksy</title>

<style>
body {
    font-family: sans-serif;
    background: #f5f7fa;
    padding: 12px;
}

main {
    max-width: 520px;
    margin: auto;
}

img {
    display: block;
    max-width: 320px;
    width: 100%;
    margin: auto;
}

input {
    width: 100%;
    height: 48px;
    margin-top: 12px;
    font-size: 18px;
    box-sizing: border-box;
}

.row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

button {
    flex: 1;
    height: 46px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    touch-action: manipulation;
}
</style>
</head>

<body>

<main>

<img id="banner" alt="Flicksy">

<div style="text-align:center">
    Connected / <span id="host"></span>
</div>

<input
    id="text"
    type="text"
    enterkeyhint="send"
    autocomplete="off">

<div class="row">
    <button id="send" tabindex="-1">Send</button>
    <button data-vk="13" tabindex="-1">ENTER</button>
</div>

<div class="row">
    <button data-vk="27" tabindex="-1">ESC</button>
    <button data-vk="9"  tabindex="-1">TAB</button>
    <button data-vk="8"  tabindex="-1">BS</button>
</div>

<div class="row">
    <button data-vk="38" tabindex="-1">↑</button>
    <button data-vk="40" tabindex="-1">↓</button>
    <button data-vk="37" tabindex="-1">←</button>
    <button data-vk="39" tabindex="-1">→</button>
</div>

</main>

<script>
const input = document.getElementById("text");

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("banner").src =
    "/banner.png?token=" + encodeURIComponent(token);

document.getElementById("host").textContent = location.host;

function post(url, body)
{
    return fetch(
        url + "?token=" + encodeURIComponent(token),
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: body
        });
}

function sendText()
{
    if (!input.value)
        return;

    const text = input.value;

    input.focus();

    post(
        "/input",
        "text=" + encodeURIComponent(text));

    input.value = "";
}

function sendKey(vk)
{
    input.focus();

    post(
        "/key",
        "vk=" + encodeURIComponent(vk));
}

document.getElementById("send").onclick = sendText;

input.addEventListener("keydown", e =>
{
    if (e.isComposing)
        return;

    if (e.key === "Enter")
    {
        e.preventDefault();
        sendText();
    }
});

document.querySelectorAll("[data-vk]").forEach(button =>
{
    button.onpointerdown = () => input.focus();

    button.onclick = () =>
        sendKey(Number(button.dataset.vk));
});

</script>

</body>
</html>
