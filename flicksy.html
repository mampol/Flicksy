<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Flicksy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f3f4f6;
    color: #222;
}

main {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
}

header {
    margin-bottom: 12px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 26px;
}

#host {
    margin-top: 3px;
    font-size: 12px;
    color: #777;
}

.panel {
    padding: 14px;

    background: white;
    border-radius: 14px;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);
}

#inputText {
    width: 100%;
    height: 54px;

    padding: 0 14px;

    font-size: 20px;

    border: 1px solid #ccc;
    border-radius: 9px;

    outline: none;
}

#inputText:focus {
    border-color: #777;
}

button {
    width: 100%;
    height: 50px;

    border: 0;
    border-radius: 9px;

    background: #f0f1f2;

    font-size: 16px;
    font-weight: 600;

    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;
}

button:active {
    background: #ddd;
    transform: scale(0.97);
}

.row {
    display: grid;

    gap: 8px;
    margin-top: 8px;
}

.row2 {
    grid-template-columns:
        repeat(2, 1fr);
}

.row3 {
    grid-template-columns:
        repeat(3, 1fr);
}

.row4 {
    grid-template-columns:
        repeat(4, 1fr);
}

#message {
    height: 18px;

    margin-top: 8px;

    text-align: center;

    font-size: 12px;
    color: #777;
}
</style>

</head>

<body>

<main>

<header>

    <h1>Flicksy</h1>

    <div id="host"></div>

</header>


<div class="panel">

    <!-- 入力欄 -->

    <input
        id="inputText"
        type="text"
        placeholder="ここに入力"
        enterkeyhint="send"
        autocomplete="off"
        autocapitalize="off">


    <!-- 送信 / ENTER -->

    <div class="row row2">

        <button onclick="sendText()">
            送信
        </button>

        <button onclick="sendKey(0x0D)">
            ENTER
        </button>

    </div>


    <!-- ESC / TAB / BS -->

    <div class="row row3">

        <button onclick="sendKey(0x1B)">
            ESC
        </button>

        <button onclick="sendKey(0x09)">
            TAB
        </button>

        <button onclick="sendKey(0x08)">
            BS
        </button>

    </div>


    <!-- カーソルキー -->

    <div class="row row4">

        <button onclick="sendKey(0x26)">
            ↑
        </button>

        <button onclick="sendKey(0x28)">
            ↓
        </button>

        <button onclick="sendKey(0x25)">
            ←
        </button>

        <button onclick="sendKey(0x27)">
            →
        </button>

    </div>


    <div id="message"></div>

</div>

</main>


<script>

const inputText =
    document.getElementById("inputText");

const message =
    document.getElementById("message");

const host =
    document.getElementById("host");


/*
    接続先表示
*/
host.textContent =
    "Connected / " + location.host;


/*
    スマホIMEのEnterで送信
*/
inputText.addEventListener(
    "keydown",
    event =>
    {
        if (event.key !== "Enter")
            return;

        if (event.isComposing)
            return;

        event.preventDefault();

        sendText();
    });


/*
    POST共通処理
*/
async function post(url, body)
{
    try
    {
        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: body
                });

        return response.ok;
    }
    catch
    {
        return false;
    }
}


/*
    文字列送信
*/
async function sendText()
{
    const text =
        inputText.value;

    if (!text)
        return;


    const ok =
        await post(
            "/input",
            "text=" + encodeURIComponent(text));


    if (ok)
    {
        inputText.value = "";

        inputText.focus();

        message.textContent =
            "送信しました";
    }
    else
    {
        message.textContent =
            "送信に失敗しました";
    }
}


/*
    キー送信
*/
async function sendKey(vk)
{
    const ok =
        await post(
            "/key",
            "vk=" + vk);


    if (!ok)
    {
        message.textContent =
            "キー送信に失敗しました";
    }
}

</script>

</body>
</html>
